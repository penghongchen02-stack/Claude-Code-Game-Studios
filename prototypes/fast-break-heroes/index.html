<script>
'use strict';
// Fast Break Heroes: pixel 3-on-3 basketball, side view, one special move per player.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 320, H = 180;         // native pixel size; scaled by whole numbers
const PIXEL = true;             // pixel look: whole-number scale, no smoothing
const FONT = 'monospace';
const TITLE = 'FAST BREAK HEROES';
const CONTROLS = ['A simulated match: both teams play themselves', 'Pick the AWAY side\'s level, then watch', 'F or the speed button: 1x, 2x, 4x', 'P: pause   M: mute'];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
function fit() {

  const r = PIXEL ? 1 : s * (devicePixelRatio || 1);
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  canvas.style.imageRendering = PIXEL ? 'pixelated' : 'auto';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = !PIXEL;
}
addEventListener('resize', fit); fit();
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', bold = true) {
  ctx.fillStyle = c; ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, Math.round(x), Math.round(y));
}
function textOutlined(s, x, y, size, c, o, align = 'center') {
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) text(s, x + dx, y + dy, size, o, align);
  text(s, x, y, size, c, align);
}
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function orect(x, y, w, h, c, o = OUT) { rect(x - 1, y - 1, w + 2, h + 2, o); rect(x, y, w, h, c); }

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code);
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code === 'Tab' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
// ---- Touch: a thumb stick on the left half, buttons on the right; shown once the screen is touched ----
const touch = { on: params.get('touch') === '1', stick: null, held: {}, pointers: {} };
const BUTTONS = [ // logical px; code: the key each stands for
  { code: 'KeyP', label: 'PAUSE', x: 300, y: 40, r: 13, c: '#ccc' },
  { code: 'KeyF', label: 'SPEED', x: 300, y: 72, r: 13, c: '#ffd27a' },
];
function canvasPoint(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
function stickDirs() { // the stick's offset as held arrow keys, with a dead zone
  for (const c of ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown']) if (touch.held[c]) { down.delete(c); delete touch.held[c]; }
  const st = touch.stick; if (!st) return;
  const dx = st.x - st.x0, dy = st.y - st.y0, L = Math.hypot(dx, dy); if (L < 5) return;
  const hold = c => { down.add(c); touch.held[c] = true; };
  if (Math.abs(dx) > L * 0.38) hold(dx > 0 ? 'ArrowRight' : 'ArrowLeft');

canvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') return;
  e.preventDefault(); startAudio(); touch.on = true;
  const pt = canvasPoint(e);
  if (scene !== 'play') { // any tap starts or continues; the difficulty arrows by their side
    if (scene === 'title' && pt.y > 70 && pt.y < 92) { if (pt.x < W / 2 - 30) hit.add('ArrowLeft'); else if (pt.x > W / 2 + 30) hit.add('ArrowRight'); else hit.add('Enter'); }
    else hit.add('Enter');

  }
  const b = BUTTONS.find(b => Math.hypot(pt.x - b.x, pt.y - b.y) <= b.r + 6);

});
canvas.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') return; e.preventDefault();

});
const endTouch = e => {

function drawTouchUI() {

addEventListener('pointerdown', () => startAudio());
addEventListener('blur', () => down.clear());

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)();
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };

  if (audio.ac.state === 'suspended') audio.ac.resume();

function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.3, slide = 0) {

const sfx = {
  bounce: () => tone(140, 0.07, 'sine', 0.25, -60),
  swish: () => { tone(1200, 0.12, 'triangle', 0.2, -500); tone(1800, 0.08, 'sine', 0.1, -800); },
  clank: () => { tone(420, 0.12, 'square', 0.2, -100); tone(300, 0.2, 'triangle', 0.15, -80); },
  pass: () => tone(500, 0.06, 'triangle', 0.15, 200),
  whoosh: () => tone(200, 0.35, 'sawtooth', 0.2, 900),
  jump: () => tone(300, 0.1, 'sine', 0.12, 200),
  block: () => { tone(90, 0.2, 'square', 0.3, -40); tone(60, 0.3, 'sawtooth', 0.2); },
  steal: () => { tone(700, 0.08, 'square', 0.2, 300); tone(1000, 0.1, 'square', 0.15, 300); },
  buzzer: () => { tone(180, 0.9, 'square', 0.3); tone(182, 0.9, 'sawtooth', 0.2); },
  cheer: () => { for (let i = 0; i < 4; i++) tone(600 + i * 150, 0.25 + i * 0.05, 'triangle', 0.08, 150); },
  special: () => { tone(400, 0.15, 'square', 0.2, 400); tone(800, 0.3, 'square', 0.2, 800); },
  select: () => tone(900, 0.06, 'square', 0.15),

// ---- The world ---------------------------------------------------------------------------
const OUT = '#1c0908';                                   // the outline on every figure
const COURT = 640;                                       // court length in world px (94 ft)
const DEPTH_PX = 340;                                    // the court's width in world px (50 ft): z in [0,1] spans it
const COURT_X0 = 16, COURT_W = 288, COURT_Y0 = 56, COURT_H = 104; // the court on screen, seen from above the near side
const SX = COURT_W / COURT, HSC = 0.6;                  // world x to screen, and height above the floor to screen
const HOOPS = [{ x: 26, dir: 1 }, { x: 614, dir: -1 }];  // dir: from the rim toward midcourt
const RIM_H = 60;                                        // rim height above the floor
const G = 320;                                           // gravity for the ball, px per second squared
const wx = x => COURT_X0 + x * SX;                       // world x to screen x
const floorY = z => COURT_Y0 + z * COURT_H;              // world depth to screen y on the floor
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;

function dist3(ax, az, ah, bx, bz, bh) { return Math.hypot(ax - bx, (az - bz) * DEPTH_PX, ah - bh); }

const ROLES = {
  ss: { name: 'SHARPSHOOTER', special: 'HEAT CHECK', speed: 1.0, torso: [8, 6], legs: 3, legW: 2, three: 0.1, block: 0.9, hair: 'spiky' },
  sl: { name: 'SLASHER', special: 'JET DRIVE', speed: 1.25, torso: [9, 5], legs: 2, legW: 2, three: -0.1, block: 0.8, hair: 'band' },
  big: { name: 'BIG', special: 'WALL', speed: 0.85, torso: [11, 6], legs: 3, legW: 3, three: -0.25, block: 1.4, hair: 'flat' },
};
const TEAMS = [
  { name: 'HOME', jersey: '#f4f4ec', trim: '#2fa84f', shorts: '#2fa84f', color: '#4de07a' },
  { name: 'AWAY', jersey: '#2f5fd0', trim: '#e0393e', shorts: '#e0393e', color: '#ff6b6b' },
];
const HAIR = ['#715037', '#e8c84a', '#d04a2a', '#3a2a1a', '#6a4a2a', '#2a2a3a', '#8a4ad0', '#f0ead0', '#c4916d', '#1a1a1a'];
const SKIN = ['#ffb681', '#c98a5a', '#f3c9a0', '#ffdb9b', '#8a5a3a', '#8a5a3a', '#f3c9a0', '#c98a5a', '#ffb681', '#6a4028'];
const LEVELS = ['easy', 'normal', 'hard'];
const ai = (p, key) => tune[`ai_${p.team === 1 ? state.level : 'normal'}_${key}`];

// ---- State --------------------------------------------------------------------------------
let scene, state;
let level = 'normal';
function mkPlayer(team, role, i) {
  return {
    id: i, team, role, x: 320, z: 0.5, h: 0, vh: 0, face: team === 0 ? 1 : -1, vx: 0, vz: 0, moving: false,
    animT: rng() * 10, meter: 0, charge: -1, shootT: 0, jumping: false, stun: 0, lunge: 0, lungeRolled: false,
    heat: 0, jet: 0, wall: 0, dunk: null, buffer: null, think: rng() * 0.3, cut: 0, cutT: tune.cut_every * (0.5 + rng()),
    jumpVx: 0, jumpVz: 0, hair: HAIR[i], skin: SKIN[i], flash: 0, pushX: 0, pushZ: 0, landT: 0, grinT: 0,
  };
}
function reset() {
  seed = Number(params.get('seed')) || CONFIG.seed;
  state = {
    t: 0, score: [0, 0], gained: '', level, half: 1, clock: tune.half_seconds, shotClock: tune.shot_clock,
    players: [], ball: null, poss: 0, ctrl: -1, speed: 1, feed: [], cam: 160,
    stats: { team: [0, 1].map(() => ({ pts: 0, fga: 0, fgm: 0, tpa: 0, tpm: 0, stl: 0, blk: 0, spc: 0, ast: 0 })), player: {} }, baskets: 0, sudden: false, dead: 0, crowd: 0,
    popups: [], hints: { moved: false, passed: false, shot: false, defended: false, special: false }, shake: 0,
    lastPasser: null, lastPassT: -9, ended: false, halfMsg: 0, flashT: 0,
  };
  const roles = ['sl', 'ss', 'big', 'sl', 'ss']; // five a side: point guard, shooter, centre, forward, forward
  for (let t = 0; t < 2; t++) for (let r = 0; r < 5; r++) { state.players.push(mkPlayer(t, roles[r], t * 5 + r)); state.stats.player[t * 5 + r] = { pts: 0, fga: 0, fgm: 0, ast: 0, stl: 0, blk: 0, spc: 0 }; }
  state.ball = { x: 320, z: 0.5, h: 0, vx: 0, vz: 0, vh: 0, holder: null, mode: 'held', pass: null, shot: null, dribT: 0, pickup: 0, trail: [], spin: 0 };
  startHalf(1);
}
const hoopFor = team => HOOPS[(team === 0) === (state.half === 1) ? 1 : 0]; // the hoop a team attacks
const defends = team => hoopFor(1 - team);                                     // the hoop a team defends
function startHalf(half) {
  state.half = half; state.clock = tune.half_seconds;
  const team = half === 1 ? 0 : 1;
  for (const p of state.players) {
    const hoop = hoopFor(p.team), s = spotFor(p, hoop);
    p.x = s.x; p.z = s.z; p.h = 0; p.jumping = false; p.charge = -1; p.dunk = null; p.heat = p.jet = p.wall = 0; p.stun = 0;
    p.face = hoop.dir * -1;
  }
  const handler = state.players.find(p => p.team === team && p.id % 5 === 0);
  const hoop = hoopFor(team);
  handler.x = hoop.x + hoop.dir * 300; handler.z = 0.5;
  for (const p of state.players) if (p.team !== team) { const d = defends(p.team), sl = p.id % 5; p.x = d.x + d.dir * (40 + 35 * sl); p.z = [0.5, 0.2, 0.5, 0.8, 0.35][sl]; }
  give(handler);
}
function spotFor(p, hoop) { // the five spots by slot: point at the top, wings, a corner, the centre low
  const d = hoop.dir, sl = p.id % 5;
  if (sl === 0) return { x: hoop.x + d * 175, z: 0.5 };
  if (sl === 1) return { x: hoop.x + d * 150, z: 0.14 };
  if (sl === 2) return { x: hoop.x + d * 30, z: 0.5 };
  if (sl === 3) return { x: hoop.x + d * 125, z: 0.86 };
  return { x: hoop.x + d * 45, z: 0.1 };

function give(p) {
  const b = state.ball;
  b.holder = p; b.mode = 'held'; b.pass = null; b.shot = null; b.x = p.x; b.z = p.z; b.h = 8;
  if (state.poss !== p.team) { state.shotClock = tune.shot_clock; }

}

}

// ---- Shooting, passing, stealing ------------------------------------------------------------
function startCharge(p) {
  const hoop = hoopFor(p.team);
  if (dist2(p, { x: hoop.x, z: 0.5 }) < tune.dunk_range) { startDunk(p, false); return; }
  p.charge = 0; p.face = Math.sign(hoop.x - p.x) || p.face; p.vx = p.vz = 0;
}
function releaseShot(p) {

}
function launchShot(p, o) {

  }

function startDunk(p, unblockable) {
  const hoop = hoopFor(p.team);

}
function blockBy(q, shooter) {
  const b = state.ball;
  b.holder = null; b.mode = 'loose'; b.shot = null; b.pass = null; b.pickup = 0.25;
  b.x = shooter.x; b.z = shooter.z; b.h = Math.max(b.h, 12);
  b.vx = -shooter.face * (40 + rng() * 30); b.vz = (rng() - 0.5) * 0.6; b.vh = 30;
  fill(q, tune.meter_block); popup(q.x, q.z, 34, 'BLOCK!', '#7fd4ff'); sfx.block(); state.shake = 0.2; state.stats.team[q.team].blk++; state.stats.player[q.id].blk++; say(`BLOCKED BY ${TEAMS[q.team].name} ${NUMBER_OF[q.id]}`);

    const o = nearestOpp(q), open = o ? Math.min(40, dist2(o, q)) : 40;

    const dx = q.x - p.x;
    if (dir.x && Math.sign(dx) === Math.sign(dir.x)) s += 30;
    if (dir.z && Math.sign(q.z - p.z) === Math.sign(dir.z)) s += 15;

// ---- The step ---------------------------------------------------------------------------------
function updatePlay(dt) {

    s.clock -= dt;

  for (let c = 0; c < W / 8 + 1; c++) { const sx = c * 8, sk = CROWD[Math.floor(hash(c, 9) * CROWD.length)], hc = HAIR[Math.floor(hash(c, 11) * HAIR.length)]; rect(sx + 1, H - 5, 5, 5, hc); rect(sx + 1, H - 2, 5, 2, sk); rect(sx, H - 8, 7, 3, SHIRTS[Math.floor(hash(c, 13) * SHIRTS.length)]); }
}
function drawHoop(hp) { // side-on at the end of the court: the stanchion from the apron, the backboard, the rim pointing in
  const x = Math.round(wx(hp.x)), fy = Math.round(floorY(0.5)), rimY = Math.round(fy - RIM_H * HSC), d = hp.dir;
  rect(x - d * 10, rimY - 2, 1, fy + 6 - rimY + 2, '#777'); rect(x - d * 10 - (d > 0 ? 1 : 0), fy + 5, 2, 2, '#444'); // the stanchion and its base
  orect(x - d * 8 - (d > 0 ? 2 : 0), rimY - 12, 2, 18, '#f4f4ec'); rect(x - d * 8 - (d > 0 ? 1 : 0), rimY - 5, 1, 4, '#c8362e'); // the backboard
  rect(x - d * 7 - (d > 0 ? 0 : 1), rimY, 7, 1, OUT); rect(x - d * 6, rimY, 5, 1, '#ff7a2a'); // the rim
  for (let i = 0; i < 3; i++) { rect(x - d * 5, rimY + 1 + i * 2, 1, 1, '#f4f4ec'); rect(x - d * 2, rimY + 1 + i * 2, 1, 1, '#f4f4ec'); rect(x - d * 3, rimY + 2 + i * 2, 1, 1, '#f4f4ec'); } // the net
  drawShadow(x - d * 3, fy + 1, 6);

function drawWorld() {
  const s = state, b = s.ball;
  drawGym(s.t, s.crowd);
  for (const hp of HOOPS) drawHoop(hp);
  for (const p of s.players) drawShadow(wx(p.x), floorY(p.z), 10);
  drawShadow(wx(b.x), floorY(b.z), 4);
  for (const p of s.players) if (p.wall > 0) { ctx.fillStyle = 'rgba(255,225,77,0.2)'; ctx.beginPath(); ctx.ellipse(wx(p.x), floorY(p.z), tune.wall_range * SX, tune.wall_range / DEPTH_PX * COURT_H, 0, 0, Math.PI * 2); ctx.fill(); }
  const items = s.players.map(p => ({ z: p.z, p })); items.push({ z: b.z + 0.001, ball: true });
  items.sort((a, c) => a.z - c.z);
  for (const it of items) {
    if (it.ball) {
      if (b.mode === 'shot' || b.mode === 'pass') for (let i = 1; i < b.trail.length; i++) { const tr = b.trail[i]; rect(Math.round(wx(tr.x)), Math.round(floorY(tr.z) - tr.h * HSC - 1), 1, 1, b.shot && b.shot.heat ? (i < 3 ? '#ffe14d' : '#ff8c42') : 'rgba(255,170,90,0.5)'); }
      drawBall(Math.round(wx(b.x)), Math.round(floorY(b.z) - b.h * HSC - 2), b.spin);
    } else drawPlayer(it.p, wx(it.p.x), floorY(it.p.z) - it.p.h * HSC);
  }
  for (const p of s.players) {
    const sx = Math.round(wx(p.x)), fy = Math.round(floorY(p.z));
    const full = p.meter >= 1 && Math.floor(s.t * 8) % 2 === 0;
    orect(sx - 5, fy + 2, 10, 2, '#2a2a3a'); rect(sx - 5, fy + 2, Math.round(10 * p.meter), 2, full ? '#fff' : p.meter >= 1 ? '#ffe14d' : TEAMS[p.team].color);
    if (p.team === 0 && p.id === s.ctrl && scene !== 'figures') {
      const ty = fy - p.h * HSC - 25;
      rect(sx - 3, ty - 3, 6, 1, OUT); rect(sx - 2, ty - 2, 4, 1, '#4de07a'); rect(sx - 1, ty - 1, 2, 1, '#4de07a'); rect(sx - 3, ty - 2, 1, 1, OUT); rect(sx + 2, ty - 2, 1, 1, OUT); rect(sx - 2, ty - 1, 1, 1, OUT); rect(sx + 1, ty - 1, 1, 1, OUT); rect(sx - 1, ty, 2, 1, OUT);
      if (p.meter >= 1) textOutlined('SHIFT', sx, ty - 7, 6, '#ffe14d', OUT);
    }
    if (p.charge >= 0) {
      const prog = Math.min(1.2, p.charge / tune.shot_charge_time), width = tune.sweet_width * (p.heat > 0 ? tune.heat_sweet_mult : 1);
      const bx = sx - 10, by = fy - p.h * HSC - 31;
      orect(bx, by, 20, 3, '#2a2a3a');
      rect(bx + Math.round(20 * (tune.sweet_center - width)), by, Math.max(1, Math.round(40 * width)), 3, '#ffe14d');
      const inSweet = Math.abs(prog - tune.sweet_center) <= width;
      rect(bx + Math.round(20 * Math.min(1, prog)) - 1, by - 1, 2, 5, inSweet ? '#fff' : '#ff6b6b');
      if (inSweet) { rect(bx - 2, by - 3, 24, 1, '#fff'); rect(bx - 2, by + 5, 24, 1, '#fff'); }
    }
  }
  for (const pp of s.popups) textOutlined(pp.s, Math.round(wx(pp.x)), Math.round(floorY(pp.z) - pp.h * HSC - pp.t * 14), 7, pp.c, OUT);
}
function fmt(t) { t = Math.max(0, Math.ceil(t)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; }
function drawHUD() {
  const s = state;
  // the scoreboard over the stands, big enough for a phone
  orect(70, 2, 180, 22, '#10131f', OUT); rect(71, 3, 178, 1, '#3a5fb0');
  rect(72, 4, 44, 19, TEAMS[0].trim); text(TEAMS[0].name, 94, 13, 8, '#fff');
  text(String(s.score[0]), 130, 13, 12, '#fff');

  rect(170, 4, 1, 19, '#3a3f55'); text(String(Math.max(0, Math.ceil(s.shotClock))), 180, 13, 10, '#ff5a5a');
  rect(190, 4, 1, 19, '#3a3f55');

  // who has the ball, the speed, the away level

  text(hold ? `BALL ${TEAMS[hold.team].name} ${NUMBER_OF[hold.id]}` : s.ball.mode === 'shot' ? 'SHOT UP' : s.ball.mode === 'pass' ? 'PASS' : 'LOOSE BALL', 35, 10, 7, '#fff');
  text(`SPEED ${s.speed}X`, 35, 19, 7, '#ffd27a');
  orect(253, 3, 64, 21, '#10131f', OUT); text('AWAY LEVEL', 285, 10, 6, '#aab'); text(s.level.toUpperCase(), 285, 19, 7, '#fff');
  // the commentary, one line, fading
  const f = s.feed[0];
  if (f && f.t < 6) textOutlined(f.s, W / 2, COURT_Y0 + COURT_H + 7, 7, '#fff', OUT);
}
function statsPanel(x, y, w, title, limit = 7) { // the two sides' numbers, a row a stat
  const t = state.stats.team, rows = [['POINTS', s => s.pts], ['FIELD GOALS', s => `${s.fgm}/${s.fga}`], ['THREES', s => `${s.tpm}/${s.tpa}`], ['ASSISTS', s => s.ast], ['STEALS', s => s.stl], ['BLOCKS', s => s.blk], ['SPECIALS', s => s.spc]].slice(0, limit);
  orect(x, y, w, 14 + rows.length * 10, '#10131f', OUT);
  text(TEAMS[0].name, x + 22, y + 7, 7, TEAMS[0].color); text(title, x + w / 2, y + 7, 7, '#ffd27a'); text(TEAMS[1].name, x + w - 22, y + 7, 7, TEAMS[1].color);
  rows.forEach(([name, fn], i) => { const yy = y + 20 + i * 10; text(String(fn(t[0])), x + 22, yy, 8, '#fff'); text(name, x + w / 2, yy, 6, '#aab'); text(String(fn(t[1])), x + w - 22, yy, 8, '#fff'); });
}
function boxScore(x, y, team) { // a side's five players: number, points, assists, steals, blocks, specials
  const cols = ['NO', 'PTS', 'AST', 'STL', 'BLK', 'SPC'], cw = 24;
  orect(x, y, cols.length * cw + 6, 20 + 5 * 10, '#10131f', OUT);
  text(TEAMS[team].name, x + 3 + cols.length * cw / 2, y + 7, 7, TEAMS[team].color);
  cols.forEach((c, i) => text(c, x + 3 + i * cw + cw / 2, y + 15, 5, '#aab'));
  for (let r = 0; r < 5; r++) {
    const p = state.players[team * 5 + r], st = state.stats.player[p.id], yy = y + 25 + r * 10;
    [NUMBER_OF[p.id], st.pts, st.ast, st.stl, st.blk, st.spc].forEach((v, i) => text(String(v), x + 3 + i * cw + cw / 2, yy, 7, i === 0 ? '#ffd27a' : '#fff'));
  }
}

// ---- Scenes -------------------------------------------------------------------------------------
// ---- The sprite sheet: assets/sprites.png, one row a player, one column a pose -------------------
// The page reads it through assets/sprites.js (python3 assets/pack-sprites.py packs the PNG into it).
// Cells are SHEET_W x SHEET_H px, the figure facing right with its feet on the cell's bottom row
// but one (the game flips it to face left). Rows: the six players in state order (home Slasher,
// Sharpshooter, Big, then away). Columns: the POSES below, in order. When the file is there it is
// drawn in place of the code figures; missing, the code figures draw. ?sheet=0 forces the code figures;
// ?scene=export draws the code figures in this layout, which is how the shipped file was made.
const SHEET_W = 28, SHEET_H = 30, SHEET_FEET = 28;
const sheet = { img: new Image(), ready: false, halo: {} };
sheet.img.onload = () => { sheet.ready = params.get('sheet') !== '0'; };
sheet.img.onerror = () => { sheet.ready = false; };
if (window.SPRITES) sheet.img.src = window.SPRITES; // assets/sprites.js, packed from assets/sprites.png: a data URL never taints the canvas
const SHEET_POSES = ['idle', 'runA1', 'runA2', 'runB1', 'runB2', 'charge1', 'charge2', 'shoot1', 'shoot2', 'jump', 'dunk1', 'dunk2', 'lunge1', 'lunge2', 'wall1', 'wall2', 'stun', 'grin'];
const SHEET_COLS = 9; // a player takes two rows of nine cells
function sheetCell(p, pose) {
  const i = Math.max(0, SHEET_POSES.indexOf(pose));
  return { sx: (i % SHEET_COLS) * SHEET_W, sy: (p.id * 2 + Math.floor(i / SHEET_COLS)) * SHEET_H };
}
function haloOf(p, cell, colour) { // a silhouette of the cell in one colour, for the special and ready flashes
  const key = cell.sx + ':' + cell.sy + ':' + colour;
  if (sheet.halo[key]) return sheet.halo[key];
  const c = document.createElement('canvas'); c.width = SHEET_W; c.height = SHEET_H;
  const g = c.getContext('2d'); g.drawImage(sheet.img, cell.sx, cell.sy, SHEET_W, SHEET_H, 0, 0, SHEET_W, SHEET_H);
  g.globalCompositeOperation = 'source-in'; g.fillStyle = colour; g.fillRect(0, 0, SHEET_W, SHEET_H);
  return sheet.halo[key] = c;
}
const POSES = [['STAND', 'idle'], ['STEP A1', 'runA1'], ['STEP A2', 'runA2'], ['STEP B1', 'runB1'], ['STEP B2', 'runB2'], ['CHARGE 1', 'charge1'], ['CHARGE 2', 'charge2'], ['SHOOT 1', 'shoot1'], ['SHOOT 2', 'shoot2'], ['JUMP', 'jump'], ['DUNK 1', 'dunk1'], ['DUNK 2', 'dunk2'], ['STEAL 1', 'lunge1'], ['STEAL 2', 'lunge2'], ['WALL 1', 'wall1'], ['WALL 2', 'wall2'], ['STUN', 'stun'], ['SCORED', 'grin']];
const scenes = {
  // export: the code figures laid out as assets/sprites.png expects, on a key colour that a script
  // turns transparent (?scene=export). The shipped sprites.png was made this way.
  export: {
    update(dt) { state.t += dt; },
    draw() {
      clear('#ff00ff');
      const page = Number(params.get('page')) || 0;
      for (let r = 0; r < 3; r++) POSES.forEach(([, name], i) => {
        if (!state.players[page * 3 + r]) return;
        const d = Object.assign({}, state.players[page * 3 + r], { animT: 0.1, face: 1, flash: 0, heat: 0, jet: 0, landT: 0, noSheet: true, h: 0, stun: 0, poseOverride: name });
        drawPlayer(d, (i % SHEET_COLS) * SHEET_W + Math.floor(SHEET_W / 2), (r * 2 + Math.floor(i / SHEET_COLS)) * SHEET_H + SHEET_FEET);
      });
    },
  },
  // sheet: the character sheet, flat: every player in every pose on a plain ground, with names
  // (?scene=sheet). Drawn in the same code as play, so it is always the game's current art.
  sheet: {
    update(dt) { state.t += dt; },
    draw() {
      const page = Number(params.get('page')) || 0;
      clear('#e9e4d8');
      text('FAST BREAK HEROES  ·  CHARACTER SHEET  ·  PAGE ' + (page + 1) + ' OF 4', W / 2, 6, 6, '#3a3028');
      for (let r = 0; r < 3; r++) {
        const p0 = state.players[page * 3 + r]; if (!p0) continue;
        text(TEAMS[p0.team].name + ' ' + ROLES[p0.role].name + ' ' + NUMBER_OF[p0.id], 2, 12 + r * 54, 4, '#3a3028', 'left');
        POSES.forEach(([name, pn], i) => {
          const x = 26 + (i % SHEET_COLS) * 33, fy = 40 + r * 54 + Math.floor(i / SHEET_COLS) * 27;
          text(name, x, fy - 27, 3, '#3a3028');
          const d = Object.assign({}, p0, { animT: 0.1, face: 1, flash: 0, heat: 0, jet: 0, landT: 0, h: 0, stun: 0, poseOverride: pn });
          drawPlayer(d, x, fy);
        });
      }
    },
  },
  figures: {
    update(dt) { state.t += dt; for (const p of state.players) p.animT += dt; },
    draw() {
      drawGym(state.t, 0);
      text('EVERY FIGURE, EACH WITH ITS OWN OUTLINE; EVERY ACTION BELOW', W / 2, 30, 7, '#fff');
      for (let i = 0; i < 10; i++) {
        const p = state.players[i], x = 20 + i * 30 + (i >= 5 ? 10 : 0), fy = 118;
        p.face = 1; p.moving = false; p.h = 0; p.charge = -1; p.stun = 0; p.wall = 0; p.jumping = false;
        drawShadow(x, fy, 10); drawPlayer(p, x, fy);
        textOutlined(ROLES[p.role].name.slice(0, 5) + ' ' + NUMBER_OF[i], x, fy + 8, 4, '#fff', OUT);
      }
      drawBall(W / 2, 100); textOutlined('BALL', W / 2, 110, 5, '#fff', OUT);
      // every action, on one player, by pose name
      POSES.forEach(([name, pn], i) => {
        const d = Object.assign({}, state.players[0], { animT: 0.1, face: 1, flash: 0, heat: 0, jet: 0, landT: 0, h: 0, stun: 0, poseOverride: pn }), x = 10 + i * 17, fy = 170;
        drawShadow(x, fy, 10); drawPlayer(d, x, fy); if (i % 2 === 0) textOutlined(name, x, fy + 6, 3, '#fff', OUT);
      });
    },
  },
  title: {
    update(dt) {
      state.t += dt;
      const i = LEVELS.indexOf(level);
      if (pressed('ArrowLeft') || pressed('ArrowUp') || pressed('KeyA')) { level = LEVELS[(i + 2) % 3]; sfx.select(); }
      if (pressed('ArrowRight') || pressed('ArrowDown') || pressed('KeyD')) { level = LEVELS[(i + 1) % 3]; sfx.select(); }
      if (pressed('Enter') || pressed('Space')) { reset(); scene = 'play'; }
    },
    draw() {
      drawGym(state.t, 1);
      for (const hp of HOOPS) drawHoop(hp);
      const t = state.t;
      for (let i = 0; i < 10; i++) { const p = state.players[i]; p.animT = t; p.moving = true; p.face = i < 5 ? 1 : -1; const x = 34 + i * 28 + (i >= 5 ? 14 : 0); drawShadow(x, 150, 10); drawPlayer(p, x + Math.sin(t * 2 + i) * 3, 150 - (i % 3 === 2 ? Math.abs(Math.sin(t * 3)) * 6 : 0)); }
      drawBall(160 + Math.sin(t * 2) * 60, 130 - Math.abs(Math.sin(t * 4)) * 20, t * 8);
      orect(40, 26, 240, 40, '#141a33', OUT);
      textOutlined(TITLE, W / 2, 40, 18, '#ffe14d', '#8a3f14');
      text('PIXEL 5-ON-5 SIMULATION · ONE SPECIAL MOVE EACH', W / 2, 58, 7, '#fff');
      orect(90, 72, 140, 18, '#1e2b5c', OUT);
      text(`<  AWAY: ${level.toUpperCase()}  >`, W / 2, 81, 10, '#fff');
      text('AWAY LEVEL: LEFT / RIGHT, OR TAP A SIDE', W / 2, 97, 7, '#ffd27a');
      orect(50, 104, 220, 40, 'rgba(16,19,31,0.92)', OUT);
      CONTROLS.forEach((c, i) => text(c.toUpperCase(), W / 2, 111 + i * 9, 7, '#fff'));
      textOutlined(Math.floor(t * 2) % 2 ? (touch.on ? 'TAP TO TIP OFF' : 'ENTER OR TAP TO TIP OFF') : '', W / 2, 160, 9, '#ffe14d', OUT);
      if (innerHeight > innerWidth) { orect(40, 60, 240, 40, '#10131f', OUT); text('TURN YOUR PHONE SIDEWAYS', W / 2, 75, 12, '#ffe14d'); text('THE MATCH FILLS THE SCREEN', W / 2, 90, 8, '#fff'); }
    },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; return; }
      if (pressed('KeyF')) { state.speed = state.speed === 1 ? 2 : state.speed === 2 ? 4 : 1; sfx.select(); }
      for (let i = 0; i < state.speed; i++) { if (scene !== 'play') break; updatePlay(dt); }
    },
    draw() {
      ctx.save(); if (state.shake > 0) ctx.translate(Math.round(Math.sin(state.t * 90)), 0);
      drawWorld(); ctx.restore();
      drawHUD(); if (scene === 'play') drawTouchUI();
    },
  },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape') || pressed('Enter')) scene = 'play'; },
    draw() { scenes.play.draw(); ctx.fillStyle = 'rgba(10,10,30,0.6)'; ctx.fillRect(0, 0, W, H); text('PAUSED', W / 2, H / 2 - 8, 18, '#fff'); text('TAP OR P TO CONTINUE', W / 2, H / 2 + 12, 8, '#ccc'); },
  },
  half: {
    update(dt) { state.t += dt; if (pressed('Enter') || pressed('Space')) { startHalf(2); state.popups = []; scene = 'play'; } },
    draw() {
      drawWorld(); ctx.fillStyle = 'rgba(10,10,30,0.8)'; ctx.fillRect(0, 0, W, H);
      text('HALF TIME', W / 2, 14, 14, '#ffe14d');
      text(`${TEAMS[0].name} ${state.score[0]}   -   ${state.score[1]} ${TEAMS[1].name}`, W / 2, 30, 10, '#fff');
      statsPanel(60, 40, 200, 'HALF TIME');
      textOutlined(Math.floor(state.t * 2) % 2 ? 'TAP OR ENTER FOR THE SECOND HALF' : '', W / 2, 168, 8, '#ffe14d', OUT);
    },
  },
  results: {
    update(dt) {
      state.t += dt;
      if (pressed('Enter') || pressed('Space')) { reset(); scene = 'play'; }
      if (pressed('KeyT') || pressed('Escape')) { scene = 'title'; }
    },
    draw() {
      drawWorld(); ctx.fillStyle = 'rgba(10,10,30,0.84)'; ctx.fillRect(0, 0, W, H);
      const win = state.score[0] > state.score[1];
      if (win) for (let i = 0; i < 40; i++) { const x = (i * 53 + state.t * 20 * (1 + i % 3)) % W, y = (i * 37 + state.t * 30) % H; rect(x, y, 2, 2, SHIRTS[i % SHIRTS.length]); }
      textOutlined(win ? 'HOME WINS' : 'AWAY WINS', W / 2, 11, 13, win ? '#ffe14d' : '#9fb4ff', '#8a3f14');
      text(`${TEAMS[0].name} ${state.score[0]}   -   ${state.score[1]} ${TEAMS[1].name}   ·   AWAY ${state.level.toUpperCase()}`, W / 2, 24, 8, '#fff');
      boxScore(6, 31, 0); boxScore(164, 31, 1);
      text('BOX SCORE: NUMBER, POINTS, ASSISTS, STEALS, BLOCKS, SPECIALS', W / 2, 108, 6, '#aab');
      statsPanel(60, 114, 200, 'TEAM', 4);
      textOutlined(Math.floor(state.t * 2) % 2 ? 'TAP OR ENTER: NEW MATCH   ·   T: TITLE' : '', W / 2, 173, 7, '#ffe14d', OUT);
    },
  },
};
// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0, ALPHA = 1;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
